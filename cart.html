<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0A4A39">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Market Koro">
  <link rel="icon" type="image/png" href="assets/images/pwa-192.png">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - Market Koro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="page-top-bar">
    <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></button>
    <span class="page-title">My Cart</span>
  </div>

  <div class="section-wrapper">
    <div id="cart-items-container"></div>

    <div class="glass-card" style="margin-top: 16px;">
      <h3 style="font-size: 1rem; color: var(--primary-color); margin-bottom: 12px;">Order Summary</h3>
      <div style="display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem;">
        <span>Subtotal</span>
        <strong id="cart-subtotal">৳0</strong>
      </div>
      <div style="display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.9rem; color: var(--text-muted);">
        <span>Delivery Charge</span>
        <span>Calculated at checkout</span>
      </div>
      <hr style="border: 0; border-top: 1px dashed var(--border-color); margin: 10px 0;">
      <div style="display: flex; justify-content: space-between; margin-bottom: 16px; font-size: 1.1rem; font-weight: bold;">
        <span>Total</span>
        <strong id="cart-grandtotal" style="color: var(--accent-color);">৳0</strong>
      </div>
      <a href="checkout.html" class="btn-accent" style="display: block; text-align: center; width: 100%;">Proceed to Checkout</a>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <div class="nav-icon-wrap"><i class="fas fa-home"></i></div>
      <span>Home</span>
    </a>
    <a href="shop.html" class="nav-item">
      <div class="nav-icon-wrap"><i class="fas fa-th-large"></i></div>
      <span>Menu</span>
    </a>
    <div class="center-cart-wrapper">
      <a href="cart.html" class="center-cart-shortcut active" aria-label="Cart">
        <i class="fas fa-shopping-cart"></i>
        <span class="nav-cart-badge cart-count-badge">0</span>
      </a>
    </div>
    <a href="shop.html?focusSearch=true" class="nav-item" onclick="focusSearchInput(event)">
      <div class="nav-icon-wrap"><i class="fas fa-search"></i></div>
      <span data-i18n="navSearch">Search</span>
    </a>
    <a href="login.html" class="nav-item account-link">
      <div class="nav-icon-wrap"><i class="fas fa-user"></i></div>
      <span>Account</span>
    </a>
  </nav>

  <script type="module" src="assets/js/firebase-config.js"></script>
  <script type="module" src="assets/js/auth.js"></script>
  <script type="module" src="assets/js/app.js"></script>
  <script type="module">
    import { renderCartItemsPage } from './assets/js/cart-checkout.js';

    function initCartPage() {
      renderCartItemsPage();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initCartPage);
    } else {
      initCartPage();
    }
  </script>
</body>
</html>
