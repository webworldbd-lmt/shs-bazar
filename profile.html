<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0A4A39">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Market Koro">
  <link rel="icon" type="image/png" href="assets/images/pwa-192.png">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account - Market Koro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    /* Custom CSS for Profile Page Enhancements */
    .profile-header-card {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 16px;
      position: relative;
    }

    .profile-avatar-container {
      position: relative;
      width: 72px;
      height: 72px;
      flex-shrink: 0;
    }

    .profile-avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--primary-light);
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    .profile-avatar-letter {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-color) 0%, #0D5C4A 100%);
      color: #FFFFFF;
      font-size: 1.8rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid var(--primary-light);
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-transform: uppercase;
    }

    .profile-info {
      flex: 1;
      min-width: 0;
    }

    .profile-name-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .profile-name {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--primary-color);
      line-height: 1.2;
    }

    .profile-meta-text {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
      word-break: break-all;
    }

    /* Quick Stats Grid */
    .quick-stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 12px 10px;
      text-align: center;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--primary-color);
    }

    .stat-icon {
      font-size: 1.25rem;
      margin-bottom: 4px;
      display: inline-block;
    }

    .stat-card.stat-orders .stat-icon { color: var(--primary-color); }
    .stat-card.stat-pending .stat-icon { color: var(--accent-color); }
    .stat-card.stat-wishlist .stat-icon { color: #EC4899; }

    .stat-number {
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--text-primary);
      line-height: 1.1;
    }

    .stat-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-top: 2px;
    }

    /* Modal overlay custom styling */
    .profile-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(5px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .profile-modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .profile-modal-card {
      background: var(--card-bg);
      color: var(--text-primary);
      border-radius: 20px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
      position: relative;
      transform: scale(0.94);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .profile-modal-overlay.active .profile-modal-card {
      transform: scale(1);
    }
  </style>
</head>
<body>
  <!-- Loading Screen before Auth State Resolves -->
  <div id="auth-loading-screen" class="auth-loading-screen">
    <div class="auth-loading-card">
      <img src="assets/images/logo.png" alt="Market Koro Logo" class="auth-loading-logo">
      <div class="auth-loading-spinner"></div>
      <div class="auth-loading-text">Loading profile details...</div>
    </div>
  </div>

  <div id="profile-page-content" style="display: none;">
  <!-- Top Bar -->
  <div class="page-top-bar">
    <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></button>
    <span class="page-title" data-i18n="myAccount">My Account</span>
    <a href="settings.html" class="icon-btn" title="Settings" aria-label="Settings">
      <i class="fas fa-cog" style="font-size: 1.15rem; color: #FFFFFF;"></i>
    </a>
  </div>

  <div class="section-wrapper" style="max-width: 680px; margin: 0 auto; padding-bottom: 30px;">

    <!-- 1. Profile Display Card -->
    <div class="profile-header-card">
      <div class="profile-avatar-container">
        <img id="profile-avatar-img" class="profile-avatar-img" src="" alt="Avatar" style="display: none;">
        <div id="profile-avatar-letter" class="profile-avatar-letter">U</div>
      </div>

      <div class="profile-info">
        <div class="profile-name-row">
          <span id="profile-name" class="profile-name">Loading...</span>
          <span id="profile-role-badge" style="font-size: 0.68rem; background: var(--primary-light); color: var(--primary-color); padding: 2px 7px; border-radius: 12px; font-weight: 800; text-transform: uppercase;">Customer</span>
        </div>
        <div id="profile-username-wrap" class="profile-meta-text" style="display: none; font-weight: 700; color: var(--primary-color);">
          <i class="fas fa-at" style="color: var(--primary-color);"></i>
          <span id="profile-username"></span>
        </div>
        <div class="profile-meta-text">
          <i class="far fa-envelope" style="color: var(--accent-color);"></i>
          <span id="profile-email">...</span>
        </div>
        <div class="profile-meta-text">
          <i class="fas fa-phone-alt" style="color: var(--primary-color);"></i>
          <span id="profile-phone">No phone number added</span>
        </div>
      </div>
    </div>

    <!-- 2. Quick Stats Summary Cards -->
    <div class="quick-stats-grid">
      <div class="stat-card stat-orders" onclick="scrollToOrderHistory()">
        <i class="fas fa-shopping-bag stat-icon"></i>
        <div id="stat-total-orders" class="stat-number">0</div>
        <div class="stat-label" data-i18n="totalOrders">Total Orders</div>
      </div>
      <div class="stat-card stat-pending" onclick="scrollToOrderHistory()">
        <i class="fas fa-clock stat-icon"></i>
        <div id="stat-pending-orders" class="stat-number">0</div>
        <div class="stat-label" data-i18n="pendingOrders">Pending</div>
      </div>
      <div class="stat-card stat-wishlist" onclick="window.location.href='wishlist.html'">
        <i class="fas fa-heart stat-icon"></i>
        <div id="stat-wishlist-items" class="stat-number">0</div>
        <div class="stat-label" data-i18n="wishlistCount">Wishlist</div>
      </div>
    </div>

    <!-- 3. Order History Section -->
    <div id="order-history-section" class="glass-card" style="margin-bottom: 24px;">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;">
        <h3 style="color: var(--primary-color); font-size: 1.05rem; margin: 0; font-weight: 800; display: flex; align-items: center; gap: 8px;">
          <i class="fas fa-shopping-bag" style="color: var(--accent-color);"></i> <span data-i18n="orderHistory">Order History</span>
        </h3>
        <a href="orders.html" style="font-size: 0.8rem; font-weight: 700; color: var(--accent-color); text-decoration: none;">
          <span data-i18n="viewAll">View All</span> <i class="fas fa-arrow-right" style="font-size: 0.75rem;"></i>
        </a>
      </div>
      <div id="user-orders-list">
        <div style="text-align: center; color: var(--text-muted); padding: 20px;">
          <i class="fas fa-spinner fa-spin" style="font-size: 1.5rem; color: var(--primary-color);"></i>
          <p style="margin-top: 8px; font-size: 0.9rem;">Loading order history...</p>
        </div>
      </div>
    </div>

    <!-- 4. Bottom Logout Action -->
    <div style="text-align: center; margin-top: 20px;">
      <button onclick="openLogoutConfirmModal()" class="btn-outline" style="color: var(--danger-color); border-color: var(--danger-color); font-size: 0.9rem; padding: 10px 24px; border-radius: 25px; font-weight: 800; width: 100%; max-width: 320px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: rgba(239, 68, 68, 0.05);">
        <i class="fas fa-sign-out-alt"></i> <span data-i18n="logoutAccount">Logout Account</span>
      </button>
    </div>

  </div>

  <!-- Logout Confirmation Modal -->
  <div id="logout-confirm-modal" class="profile-modal-overlay" onclick="if(event.target===this) closeLogoutConfirmModal();">
    <div class="profile-modal-card" style="max-width: 380px; text-align: center;">
      <div style="font-size: 2.5rem; color: var(--danger-color); margin-bottom: 8px;">
        <i class="fas fa-sign-out-alt"></i>
      </div>
      <h3 style="font-size: 1.15rem; color: var(--text-primary); margin-bottom: 6px; font-weight: 800;" data-i18n="confirmLogoutTitle">Confirm Logout</h3>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px;" data-i18n="confirmLogoutDesc">
        Are you sure you want to log out of your Market Koro account?
      </p>
      <div style="display: flex; gap: 10px; justify-content: center;">
        <button type="button" onclick="closeLogoutConfirmModal()" class="btn-outline" style="flex: 1; font-size: 0.88rem; padding: 9px 16px;" data-i18n="cancel">Cancel</button>
        <button type="button" onclick="confirmLogoutAction()" class="btn-primary" style="flex: 1; background: var(--danger-color); border-color: var(--danger-color); font-size: 0.88rem; padding: 9px 16px;" data-i18n="yesLogout">Yes, Logout</button>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <div class="nav-icon-wrap"><i class="fas fa-home"></i></div>
      <span>Home</span>
    </a>
    <a href="shop.html" class="nav-item">
      <div class="nav-icon-wrap"><i class="fas fa-th-large"></i></div>
      <span>Menu</span>
    </a>
    <div class="center-cart-wrapper">
      <a href="cart.html" class="center-cart-shortcut" aria-label="Cart">
        <i class="fas fa-shopping-cart"></i>
        <span class="nav-cart-badge cart-count-badge">0</span>
      </a>
    </div>
    <a href="shop.html?focusSearch=true" class="nav-item" onclick="focusSearchInput(event)">
      <div class="nav-icon-wrap"><i class="fas fa-search"></i></div>
      <span data-i18n="navSearch">Search</span>
    </a>
    <a href="profile.html" class="nav-item active account-link">
      <div class="nav-icon-wrap"><i class="fas fa-user"></i></div>
      <span>Account</span>
    </a>
  </nav>
  </div>

  <script type="module" src="assets/js/firebase-config.js"></script>
  <script type="module" src="assets/js/auth.js"></script>
  <script type="module" src="assets/js/app.js"></script>
  <script type="module">
    import { onAuthStateUpdate, logoutUser, getLocalWishlist } from './assets/js/auth.js';
    import { db, collection, getDocs, query, where } from './assets/js/firebase-config.js';
    import { generatePDFInvoice } from './assets/js/invoice.js';
    import { FALLBACK_IMAGE } from './assets/js/products.js';

    let currentOrders = [];
    let activeUser = null;
    let activeProfile = null;

    // Window scroll helper
    window.scrollToOrderHistory = () => {
      const el = document.getElementById('order-history-section');
      if (el) el.scrollIntoView({ behavior: 'smooth' });
    };

    // Logout Modal
    window.openLogoutConfirmModal = () => {
      document.getElementById('logout-confirm-modal').classList.add('active');
    };

    window.closeLogoutConfirmModal = () => {
      document.getElementById('logout-confirm-modal').classList.remove('active');
    };

    window.confirmLogoutAction = () => {
      logoutUser();
    };

    // Order helpers
    window.downloadInvoiceHandler = (orderId) => {
      const order = currentOrders.find(o => o.id === orderId);
      if (order) generatePDFInvoice(order);
    };

    window.toggleOrderDetail = (orderId) => {
      const detailEl = document.getElementById(`order-details-${orderId}`);
      const iconEl = document.getElementById(`order-toggle-icon-${orderId}`);
      if (!detailEl) return;
      if (detailEl.style.display === 'none' || !detailEl.style.display) {
        detailEl.style.display = 'block';
        if (iconEl) iconEl.className = 'fas fa-chevron-up';
      } else {
        detailEl.style.display = 'none';
        if (iconEl) iconEl.className = 'fas fa-chevron-down';
      }
    };

    function formatOrderDate(createdAt) {
      if (!createdAt) return 'N/A';
      if (createdAt.seconds) {
        return new Date(createdAt.seconds * 1000).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' });
      }
      return new Date(createdAt).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' });
    }

    function getBadgeClass(status) {
      const s = (status || 'Pending').toLowerCase().replace(/\s+/g, '-');
      return `admin-badge admin-badge-${s}`;
    }

    function updateHeaderUI() {
      if (!activeUser) return;
      const name = activeProfile?.displayName || activeUser.displayName || 'Valued Customer';
      const email = activeUser.email || '';
      const phone = activeProfile?.phone || activeUser.phoneNumber || 'No phone number added';
      const photoUrl = activeProfile?.photoURL || activeUser.photoURL;
      const initial = name.charAt(0).toUpperCase();

      document.getElementById('profile-name').textContent = name;
      document.getElementById('profile-email').textContent = email;
      document.getElementById('profile-phone').textContent = phone;
      document.getElementById('profile-role-badge').textContent = activeProfile?.role || 'Customer';

      const usernameWrap = document.getElementById('profile-username-wrap');
      const usernameEl = document.getElementById('profile-username');
      if (activeProfile?.username) {
        usernameEl.textContent = activeProfile.username;
        usernameWrap.style.display = 'flex';
      } else {
        usernameWrap.style.display = 'none';
      }

      const imgEl = document.getElementById('profile-avatar-img');
      const letterEl = document.getElementById('profile-avatar-letter');

      if (photoUrl) {
        imgEl.src = photoUrl;
        imgEl.style.display = 'block';
        letterEl.style.display = 'none';
      } else {
        imgEl.style.display = 'none';
        letterEl.textContent = initial;
        letterEl.style.display = 'flex';
      }

      const wishlistCount = (activeProfile && activeProfile.wishlist) ? activeProfile.wishlist.length : getLocalWishlist().length;
      document.getElementById('stat-wishlist-items').textContent = wishlistCount;
    }

    onAuthStateUpdate(async (user, profile) => {
      const loadingEl = document.getElementById('auth-loading-screen');
      const contentEl = document.getElementById('profile-page-content');

      if (loadingEl) {
        loadingEl.classList.add('hidden');
        loadingEl.style.display = 'none';
      }

      if (!user) {
        if (contentEl) contentEl.style.display = 'none';
        window.location.replace('login.html');
        return;
      }

      activeUser = user;
      activeProfile = profile;
      updateHeaderUI();

      if (contentEl) contentEl.style.display = 'block';

      const container = document.getElementById('user-orders-list');

      try {
        const q = query(collection(db, 'orders'), where('userId', '==', user.uid));
        const snap = await getDocs(q);
        currentOrders = [];
        snap.forEach(d => currentOrders.push({ id: d.id, ...d.data() }));

        currentOrders.sort((a, b) => {
          const timeA = a.createdAt?.seconds ? a.createdAt.seconds * 1000 : (a.createdAt || 0);
          const timeB = b.createdAt?.seconds ? b.createdAt.seconds * 1000 : (b.createdAt || 0);
          return timeB - timeA;
        });

        const totalCount = currentOrders.length;
        const pendingCount = currentOrders.filter(o => ['pending', 'processing'].includes((o.orderStatus || 'Pending').toLowerCase())).length;

        document.getElementById('stat-total-orders').textContent = totalCount;
        document.getElementById('stat-pending-orders').textContent = pendingCount;

        if (currentOrders.length === 0) {
          container.innerHTML = `
            <div style="text-align: center; padding: 26px 15px;">
              <div style="font-size: 2.2rem; color: var(--text-muted); margin-bottom: 8px;">
                <i class="fas fa-shopping-bag"></i>
              </div>
              <h4 style="font-size: 0.95rem; color: var(--text-color); margin-bottom: 4px; font-weight: 700;">You haven't placed any orders yet</h4>
              <p style="font-size: 0.82rem; color: var(--text-muted); margin-bottom: 14px;">Start shopping to explore our rich product catalog!</p>
              <a href="shop.html" class="btn-primary" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none; padding: 8px 18px; border-radius: 20px; font-size: 0.85rem;">
                <i class="fas fa-store"></i> Start Shopping
              </a>
            </div>
          `;
          return;
        }

        container.innerHTML = currentOrders.map(o => {
          const items = Array.isArray(o.items) ? o.items : [];
          const status = o.orderStatus || 'Pending';
          const badgeClass = getBadgeClass(status);
          const dateStr = formatOrderDate(o.createdAt);
          const totalPaid = Number(o.totalAmount || 0).toLocaleString('bn-BD');
          const paymentMethod = (o.paymentMethod || 'COD').toUpperCase();

          const itemThumbnails = items.slice(0, 3).map(i => `
            <img src="${i.image || (i.images && i.images[0]) || FALLBACK_IMAGE}" alt="${i.name || 'Item'}" style="width: 40px; height: 40px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border-color);">
          `).join('');

          const itemsSummaryText = items.length > 0
            ? items.slice(0, 2).map(i => `${i.name || 'Product'} (x${i.quantity || 1})`).join(', ') + (items.length > 2 ? ` + ${items.length - 2} more` : '')
            : 'Product details';

          const itemsDetailHTML = items.map(item => `
            <div style="display: flex; gap: 10px; align-items: center; background: var(--bg-color); padding: 8px; border-radius: 6px; margin-bottom: 6px; border: 1px solid var(--border-color);">
              <img src="${item.image || (item.images && item.images[0]) || FALLBACK_IMAGE}" alt="${item.name || 'Item'}" style="width: 44px; height: 44px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border-color);">
              <div style="flex: 1;">
                <div style="font-weight: 700; font-size: 0.82rem; color: var(--text-primary);">${item.name || 'Unnamed Product'}</div>
                <div style="font-size: 0.75rem; color: var(--text-muted);">
                  ৳${Number(item.price || 0).toLocaleString('bn-BD')} × ${item.quantity || 1}
                  ${item.variant ? ` | <span style="color: var(--accent-color); font-weight: 600;">Variant: ${item.variant}</span>` : ''}
                </div>
              </div>
              <div style="font-weight: 800; color: var(--primary-color); font-size: 0.85rem;">৳${(Number(item.price || 0) * Number(item.quantity || 1)).toLocaleString('bn-BD')}</div>
            </div>
          `).join('');

          const subtotal = Number(o.subtotal || items.reduce((s, i) => s + (Number(i.price || 0) * Number(i.quantity || 1)), 0));
          const deliveryCharge = Number(o.deliveryCharge || 0);
          const discountAmount = Number(o.discountAmount || 0);

          return `
            <div style="background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow-sm);">
              <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; flex-wrap: wrap; gap: 6px;">
                <div>
                  <span style="font-weight: 800; font-size: 0.9rem; color: var(--primary-color);">Order #${o.id}</span>
                  <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 2px;"><i class="far fa-clock"></i> ${dateStr}</div>
                </div>
                <span class="${badgeClass}">${status}</span>
              </div>

              <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px; background: var(--bg-color); padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-color);">
                <div style="display: flex; gap: 4px; flex-shrink: 0;">
                  ${itemThumbnails}
                </div>
                <div style="flex: 1; min-width: 0; font-size: 0.8rem; color: var(--text-primary);">
                  <div style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${itemsSummaryText}</div>
                  <div style="margin-top: 2px;">
                    <span style="color: var(--primary-color); font-weight: 800; font-size: 0.88rem;">৳${totalPaid}</span>
                    <span style="font-size: 0.72rem; color: var(--text-muted);"> (${paymentMethod})</span>
                  </div>
                </div>
              </div>

              <div style="display: flex; gap: 8px; align-items: center;">
                <button onclick="window.toggleOrderDetail('${o.id}')" class="btn-outline" style="flex: 1; font-size: 0.78rem; padding: 6px 10px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;">
                  <i class="fas fa-list"></i> View Details <i id="order-toggle-icon-${o.id}" class="fas fa-chevron-down" style="font-size: 0.7rem;"></i>
                </button>
                <button onclick="window.downloadInvoiceHandler('${o.id}')" class="btn-accent" style="flex: 1; font-size: 0.78rem; padding: 6px 10px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;">
                  <i class="fas fa-file-pdf"></i> Download Invoice
                </button>
              </div>

              <div id="order-details-${o.id}" style="display: none; margin-top: 12px; border-top: 1px dashed var(--border-color); padding-top: 12px;">
                <h4 style="font-size: 0.82rem; color: var(--primary-color); font-weight: 800; margin-bottom: 6px;"><i class="fas fa-box"></i> Purchased Items (${items.length})</h4>
                <div style="margin-bottom: 10px;">
                  ${itemsDetailHTML}
                </div>

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; font-size: 0.78rem;">
                  <div style="background: var(--bg-color); padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border-color);">
                    <strong style="color: var(--primary-color); display: block; margin-bottom: 4px;"><i class="fas fa-map-marker-alt"></i> Delivery Address</strong>
                    <div><strong>Division:</strong> ${o.shippingAddress?.division || 'N/A'}</div>
                    <div><strong>District:</strong> ${o.shippingAddress?.district || 'N/A'}</div>
                    <div><strong>Upazila:</strong> ${o.shippingAddress?.thana || o.shippingAddress?.upazila || 'N/A'}</div>
                    <div><strong>Address:</strong> ${o.shippingAddress?.village || 'N/A'}</div>
                    ${o.shippingAddress?.notes ? `<div style="margin-top:2px; font-style:italic; color:var(--text-muted);">Notes: ${o.shippingAddress.notes}</div>` : ''}
                  </div>

                  <div style="background: var(--bg-color); padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border-color);">
                    <strong style="color: var(--primary-color); display: block; margin-bottom: 4px;"><i class="fas fa-credit-card"></i> Payment Summary</strong>
                    <div><strong>Method:</strong> ${paymentMethod}</div>
                    ${(o.trxId || o.bKashTxnId) ? `<div style="color: #D84315; font-weight: 700; margin-top: 2px;">${paymentMethod} TrxID: ${o.trxId || o.bKashTxnId}</div>` : ''}
                    <div style="margin-top: 4px; border-top: 1px solid var(--border-color); padding-top: 4px;">
                      <div>Subtotal: ৳${subtotal.toLocaleString('bn-BD')}</div>
                      ${discountAmount > 0 ? `<div style="color: #059669;">Discount: -৳${discountAmount.toLocaleString('bn-BD')}</div>` : ''}
                      <div>Delivery Charge: ৳${deliveryCharge.toLocaleString('bn-BD')}</div>
                      <div style="font-weight: 800; color: var(--primary-color); font-size: 0.85rem; margin-top: 2px;">
                        Grand Total: ৳${totalPaid}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error('Error fetching user orders:', err);
        container.innerHTML = `
          <div style="text-align: center; color: var(--danger-color); padding: 20px;">
            <i class="fas fa-exclamation-circle" style="font-size: 1.5rem;"></i>
            <p style="margin-top: 8px; font-size: 0.85rem;">Failed to load order history. Please try again.</p>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
