<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0A4A39">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Market Koro">
  <link rel="icon" type="image/png" href="assets/images/pwa-192.png">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Sign Up - Market Koro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- Loading Screen before Auth State Resolves -->
  <div id="auth-loading-screen" class="auth-loading-screen">
    <div class="auth-loading-card">
      <img src="assets/images/logo.png" alt="Market Koro Logo" class="auth-loading-logo">
      <div class="auth-loading-spinner"></div>
      <div class="auth-loading-text">Loading account status...</div>
    </div>
  </div>

  <div id="login-page-content" class="login-page-container" style="display: none;">
    <!-- Ambient Background Blobs -->
    <div class="login-bg-blob login-bg-blob-1"></div>
    <div class="login-bg-blob login-bg-blob-2"></div>
    <div class="login-bg-blob login-bg-blob-3"></div>

    <div class="page-top-bar" style="position: relative; z-index: 10;">
      <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></button>
      <span class="page-title">Account Login</span>
    </div>

    <div class="section-wrapper" style="max-width: 440px; margin: 0 auto; position: relative; z-index: 10; width: 100%; padding-top: 24px; padding-bottom: 32px;">
    <div class="login-card">
      <div class="login-header-wrapper">
        <div class="login-logo-container">
          <img src="assets/images/logo.png" alt="Market Koro" class="login-logo-img">
        </div>
        <h2 class="login-title">Welcome to Market Koro</h2>
        <p class="login-subtitle">Sign in to your account</p>
      </div>

      <!-- Google Sign In Button -->
      <button id="google-signin-btn" class="btn-google-signin">
        <i class="fab fa-google" style="color: #EA4335; font-size: 1.1rem;"></i> Sign in with Google
      </button>

      <div class="auth-divider-wrap">
        <span>OR WITH EMAIL</span>
      </div>

      <form id="auth-form">
        <div class="form-group" id="group-name" style="display: none;">
          <label class="form-label">Full Name</label>
          <div class="input-icon-group">
            <i class="fas fa-user input-icon-left"></i>
            <input type="text" id="auth-name" class="input-with-icon" placeholder="Enter full name">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Email Address *</label>
          <div class="input-icon-group">
            <i class="fas fa-envelope input-icon-left"></i>
            <input type="email" id="auth-email" class="input-with-icon" required placeholder="name@domain.com">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Password *</label>
          <div class="input-icon-group">
            <i class="fas fa-lock input-icon-left"></i>
            <input type="password" id="auth-pass" class="input-with-icon input-with-toggle" required placeholder="******">
            <button type="button" id="password-toggle-btn" class="password-toggle-btn" aria-label="Toggle password visibility">
              <i class="far fa-eye" id="password-toggle-icon"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="auth-submit-btn" class="auth-submit-btn-gradient" style="margin-top: 6px;">Login</button>
      </form>

      <!-- Toggle Signup/Login Mode -->
      <div style="text-align: center; margin-top: 20px; font-size: 0.88rem;">
        <span id="toggle-prompt" style="color: var(--text-muted);">Don't have an account?</span>
        <a href="#" id="toggle-mode-btn" class="auth-link-animated auth-link-accent" style="margin-left: 6px;">Sign Up</a>
      </div>

      <!-- Forgot Password -->
      <div style="text-align: center; margin-top: 12px; font-size: 0.82rem;">
        <a href="#" id="forgot-pass-btn" class="auth-link-animated auth-link-muted">Forgot Password?</a>
      </div>

      <!-- Mobile OTP Login Stub -->
      <div class="otp-stub-container">
        <button id="otp-stub-btn" class="otp-stub-btn">
          <i class="fas fa-mobile-alt"></i> Mobile OTP Login
          <span class="otp-coming-soon-badge">Coming Soon</span>
        </button>
      </div>
    </div>
  </div>
  </div>

  <script type="module" src="assets/js/firebase-config.js"></script>
  <script type="module" src="assets/js/auth.js"></script>
  <script type="module" src="assets/js/app.js"></script>
  <script type="module">
    import { loginWithEmail, registerWithEmail, loginWithGoogle, resetPassword, onAuthStateUpdate } from './assets/js/auth.js';
    import { showToast } from './assets/js/app.js';

    function initLoginPage() {
      onAuthStateUpdate((user, profile) => {
        const loadingEl = document.getElementById('auth-loading-screen');
        const contentEl = document.getElementById('login-page-content');

        if (user) {
          // If already logged in, navigate straight to target or profile/admin
          const redirectParam = new URLSearchParams(window.location.search).get('redirect');
          const target = redirectParam || (profile && profile.role === 'admin' ? 'admin.html' : 'profile.html');
          window.location.replace(target);
          return;
        }

        // Guest user - hide loading spinner and show login form
        if (loadingEl) {
          loadingEl.classList.add('hidden');
          loadingEl.style.display = 'none';
        }
        if (contentEl) contentEl.style.display = 'block';
      });

      let isSignUp = false;

      const toggleBtn = document.getElementById('toggle-mode-btn');
      const groupName = document.getElementById('group-name');
      const submitBtn = document.getElementById('auth-submit-btn');
      const togglePromptEl = document.getElementById('toggle-prompt');

      if (toggleBtn) {
        toggleBtn.addEventListener('click', (e) => {
          e.preventDefault();
          isSignUp = !isSignUp;
          if (isSignUp) {
            groupName.style.display = 'block';
            submitBtn.textContent = 'Create Account';
            togglePromptEl.textContent = 'Already have an account?';
            toggleBtn.textContent = 'Login';
          } else {
            groupName.style.display = 'none';
            submitBtn.textContent = 'Login';
            togglePromptEl.textContent = "Don't have an account?";
            toggleBtn.textContent = 'Sign Up';
          }
        });
      }

      document.getElementById('google-signin-btn')?.addEventListener('click', async () => {
        try {
          await loginWithGoogle();
          showToast('Signed in with Google!');
          const redirectParam = new URLSearchParams(window.location.search).get('redirect');
          window.location.href = redirectParam || 'index.html';
        } catch (err) {
          showToast(err.message || 'Google Sign-in failed');
        }
      });

      document.getElementById('auth-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('auth-email').value.trim();
        const pass = document.getElementById('auth-pass').value.trim();
        const name = document.getElementById('auth-name').value.trim();

        if (!email || !pass) {
          showToast('Please enter both email and password.');
          return;
        }

        if (isSignUp && !name) {
          showToast('Please enter your full name.');
          return;
        }

        submitBtn.disabled = true;
        try {
          if (isSignUp) {
            await registerWithEmail(email, pass, name);
            showToast('Account Created!');
          } else {
            await loginWithEmail(email, pass);
            showToast('Welcome back!');
          }
          const redirectParam = new URLSearchParams(window.location.search).get('redirect');
          window.location.href = redirectParam || 'index.html';
        } catch (err) {
          showToast(err.message || 'Authentication error');
        } finally {
          submitBtn.disabled = false;
        }
      });

      document.getElementById('forgot-pass-btn')?.addEventListener('click', async (e) => {
        e.preventDefault();
        const emailInput = window.prompt('Enter your registered email address for password reset:');
        if (emailInput && emailInput.trim()) {
          try {
            await resetPassword(emailInput.trim());
            showToast('Password reset link sent to your email.');
          } catch (err) {
            showToast(err.message || 'Failed to send reset email.');
          }
        }
      });

      document.getElementById('otp-stub-btn')?.addEventListener('click', () => {
        showToast('Mobile OTP Login is coming soon!');
      });

      // Password visibility toggle handler
      const passInput = document.getElementById('auth-pass');
      const passToggleBtn = document.getElementById('password-toggle-btn');
      const passToggleIcon = document.getElementById('password-toggle-icon');

      if (passInput && passToggleBtn && passToggleIcon) {
        passToggleBtn.addEventListener('click', () => {
          const isPassword = passInput.type === 'password';
          passInput.type = isPassword ? 'text' : 'password';
          passToggleIcon.className = isPassword ? 'far fa-eye-slash' : 'far fa-eye';
        });
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initLoginPage);
    } else {
      initLoginPage();
    }
  </script>
</body>
</html>
