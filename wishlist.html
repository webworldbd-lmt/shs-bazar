<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0A4A39">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Market Koro">
  <link rel="icon" type="image/png" href="assets/images/pwa-192.png">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist - Market Koro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="page-top-bar">
    <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></button>
    <span class="page-title">My Wishlist</span>
  </div>

  <div class="section-wrapper">
    <div class="product-grid" id="wishlist-products-grid"></div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <div class="nav-icon-wrap"><i class="fas fa-home"></i></div>
      <span>Home</span>
    </a>
    <a href="shop.html" class="nav-item">
      <div class="nav-icon-wrap"><i class="fas fa-th-large"></i></div>
      <span>Menu</span>
    </a>
    <div class="center-cart-wrapper">
      <a href="cart.html" class="center-cart-shortcut" aria-label="Cart">
        <i class="fas fa-shopping-cart"></i>
        <span class="nav-cart-badge cart-count-badge">0</span>
      </a>
    </div>
    <a href="shop.html?focusSearch=true" class="nav-item" onclick="focusSearchInput(event)">
      <div class="nav-icon-wrap"><i class="fas fa-search"></i></div>
      <span data-i18n="navSearch">Search</span>
    </a>
    <a href="login.html" class="nav-item account-link">
      <div class="nav-icon-wrap"><i class="fas fa-user"></i></div>
      <span>Account</span>
    </a>
  </nav>

  <script type="module" src="assets/js/firebase-config.js"></script>
  <script type="module" src="assets/js/auth.js"></script>
  <script type="module" src="assets/js/app.js"></script>
  <script type="module">
    import { fetchPublishedProducts, renderProductCard } from './assets/js/products.js';
    import { getLocalWishlist, onAuthStateUpdate } from './assets/js/auth.js';

    async function renderWishlist(user, profile) {
      const grid = document.getElementById('wishlist-products-grid');
      if (!grid) return;

      const allProducts = await fetchPublishedProducts();
      const wishlistIds = (profile && profile.wishlist) ? profile.wishlist : getLocalWishlist();
      const wishlistedProducts = allProducts.filter(p => wishlistIds.includes(p.id));

      if (wishlistedProducts.length > 0) {
        grid.innerHTML = wishlistedProducts.map(renderProductCard).join('');
      } else {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #777; padding: 40px;">Your wishlist is currently empty.</p>';
      }
    }

    function initWishlistPage() {
      onAuthStateUpdate((user, profile) => {
        renderWishlist(user, profile);
      });
      // Initial render in case auth state listener fired previously
      renderWishlist(null, null);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initWishlistPage);
    } else {
      initWishlistPage();
    }
  </script>
</body>
</html>
