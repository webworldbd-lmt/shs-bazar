<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0A4A39">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Market Koro">
  <link rel="icon" type="image/png" href="assets/images/pwa-192.png">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop - Market Koro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="page-top-bar">
    <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></button>
    <span class="page-title">Product Catalog</span>
  </div>

  <div class="search-container">
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Search products..." autocomplete="off">
      <button><i class="fas fa-search"></i></button>
    </div>
    <div class="search-results-dropdown" id="search-results"></div>
  </div>

  <div class="section-wrapper">
    <div id="category-filter-bar" style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 12px;"></div>
    <div class="product-grid" id="shop-products-grid"></div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <div class="nav-icon-wrap"><i class="fas fa-home"></i></div>
      <span>Home</span>
    </a>
    <a href="shop.html" class="nav-item active">
      <div class="nav-icon-wrap"><i class="fas fa-th-large"></i></div>
      <span>Menu</span>
    </a>
    <div class="center-cart-wrapper">
      <a href="cart.html" class="center-cart-shortcut" aria-label="Cart">
        <i class="fas fa-shopping-cart"></i>
        <span class="nav-cart-badge cart-count-badge">0</span>
      </a>
    </div>
    <a href="shop.html?focusSearch=true" class="nav-item" onclick="focusSearchInput(event)">
      <div class="nav-icon-wrap"><i class="fas fa-search"></i></div>
      <span data-i18n="navSearch">Search</span>
    </a>
    <a href="login.html" class="nav-item account-link">
      <div class="nav-icon-wrap"><i class="fas fa-user"></i></div>
      <span>Account</span>
    </a>
  </nav>

  <script type="module" src="assets/js/firebase-config.js"></script>
  <script type="module" src="assets/js/auth.js"></script>
  <script type="module" src="assets/js/products.js"></script>
  <script type="module" src="assets/js/app.js"></script>
  <script type="module">
    import { fetchPublishedProducts, renderProductCard, renderSkeletonCards, renderErrorState, renderEmptyState, fetchActiveCategories, subscribeToActiveCategories } from './assets/js/products.js';
    import { initSearch, getCurrentLang, TRANSLATIONS } from './assets/js/app.js';
    import { TRANSLATIONS as TRANSLATIONS_FILE } from './assets/js/translations.js';

    async function initShopPage() {
      const grid = document.getElementById('shop-products-grid');

      if (grid) {
        grid.innerHTML = renderSkeletonCards(8);
      }

      try {
        const products = await fetchPublishedProducts(null, 3, 1000);
        initSearch(products);

        const activeCategories = await fetchActiveCategories();

        const urlParams = new URLSearchParams(window.location.search);
        const selectedCategory = urlParams.get('category');
        const filterParam = urlParams.get('filter');
        const searchQuery = urlParams.get('search')?.trim();

        if (searchQuery) {
          const searchInput = document.getElementById('search-input');
          if (searchInput) searchInput.value = searchQuery;
        }

        // Filter tabs
        const filterBar = document.getElementById('category-filter-bar');
        const renderFilterBar = (cats) => {
          if (!filterBar) return;
          if (cats && cats.length > 0) {
            filterBar.innerHTML = `<button class="btn-outline ${!selectedCategory ? 'btn-primary' : ''}" onclick="window.location.href='shop.html'" style="padding: 4px 12px; font-size: 0.8rem; white-space: nowrap;">All</button>` +
              cats.map(c => `
                <button class="btn-outline ${selectedCategory === c.id ? 'btn-primary' : ''}"
                  onclick="window.location.href='shop.html?category=${c.id}'"
                  style="padding: 4px 12px; font-size: 0.8rem; white-space: nowrap;">
                  ${c.name}
                </button>
              `).join('');
          } else {
            filterBar.innerHTML = '';
          }
        };

        renderFilterBar(activeCategories);

        const unsubscribeShopCategories = subscribeToActiveCategories(
          (updatedCats) => {
            renderFilterBar(updatedCats);
          },
          (err) => console.warn('[Shop Categories Realtime Error]:', err)
        );

        window.addEventListener('beforeunload', () => {
          if (typeof unsubscribeShopCategories === 'function') unsubscribeShopCategories();
        });

        let displayed = products;
        if (selectedCategory) {
          displayed = displayed.filter(p => p.category === selectedCategory || (p.category && p.category.toLowerCase() === selectedCategory.toLowerCase()));
        }
        if (filterParam === 'trending') displayed = displayed.filter(p => p.isTrending);
        if (filterParam === 'flash') displayed = displayed.filter(p => p.isFlashSale);
        if (filterParam === 'bestseller') displayed = displayed.filter(p => p.isBestSeller);
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          displayed = displayed.filter(p =>
            (p.name && p.name.toLowerCase().includes(q)) ||
            (p.category && p.category.toLowerCase().includes(q)) ||
            (p.tags && p.tags.some(t => t.toLowerCase().includes(q)))
          );
        }

        if (grid) {
          if (displayed.length > 0) {
            grid.innerHTML = displayed.map(renderProductCard).join('');
          } else {
            const lang = getCurrentLang ? getCurrentLang() : 'en';
            const dict = TRANSLATIONS || TRANSLATIONS_FILE;
            const t = dict ? (dict[lang] || dict.en) : {};
            grid.innerHTML = renderEmptyState(t.noProductsFound || 'কোনো প্রোডাক্ট পাওয়া যায়নি');
          }
        }
      } catch (err) {
        console.error('[initShopPage Error]:', err);
        if (grid) {
          const lang = getCurrentLang ? getCurrentLang() : 'en';
          const dict = TRANSLATIONS || TRANSLATIONS_FILE;
          const t = dict ? (dict[lang] || dict.en) : {};
          grid.innerHTML = renderErrorState(t.errorLoadingProducts, 'window.retryInitShopPage()');
        }
      }
    }

    window.retryInitShopPage = () => {
      initShopPage();
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initShopPage);
    } else {
      initShopPage();
    }
  </script>
</body>
</html>
